name: Build & Release (ARM APK + iOS IPA)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.7.2-arm)'
        required: true
        default: 'v0.7.2-arm'
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: 🚀 Build ARM APKs & iOS IPA and Release
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=v0.7.2-arm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch flutter_ble_peripheral Swift syntax
        run: |
          python3 -c '
          import glob, os
          pattern = os.path.expanduser("~/.pub-cache/**/FlutterBlePeripheralPlugin.swift")
          for path in glob.glob(pattern, recursive=True):
              with open(path, "r") as f:
                  content = f.read()
              fixed = content.replace("uuids: map?[\"serviceUuids\"] as? [String] ,", "uuids: map?[\"serviceUuids\"] as? [String]")
              if fixed != content:
                  with open(path, "w") as f:
                      f.write(fixed)
                  print(f"Successfully patched trailing comma in {path}")
          '

      - name: Prepare Artifacts Directory
        run: mkdir -p "$GITHUB_WORKSPACE/release-assets"

      # ── 1. Build Split Android ARM APKs only (No Universal APK) ──
      - name: Build Android ARM APKs (arm64-v8a & armeabi-v7a)
        run: flutter build apk --split-per-abi --release --target-platform android-arm,android-arm64

      - name: Prepare Android ARM Artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/release-assets/ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-arm64-v8a.apk"
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/release-assets/ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-armeabi-v7a.apk"
          fi

      # ── 2. Build iOS Unsigned IPA ──
      - name: Disable Apple Team Requirement
        run: |
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 "$GITHUB_WORKSPACE/release-assets/ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}.ipa" Payload
        working-directory: apps/mobile/build/ios/iphoneos

      # ── 3. Publish GitHub Release ──
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### BLE Mesh Attendance Mobile App Release ${{ steps.vars.outputs.VERSION }}

          #### 📦 Available Downloads:

          | File | Description |
          | :--- | :--- |
          | **`ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-arm64-v8a.apk`** | ⚡ **Recommended** for modern Android devices (64-bit ARM) |
          | **`ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-armeabi-v7a.apk`** | 📱 Compatible with 32-bit ARM Android devices |
          | **`ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}.ipa`** | 🍎 **iOS Unsigned IPA** (Install via AltStore / Sideloadly / TrollStore / Scarlet) |

          #### 🚀 Highlights in this Release:
          - 🎨 **High-Contrast Dark & Light Theme UI**:
            - Fixed text contrast on green backgrounds across Teacher and Student portals.
            - "ATTENDANCE ACTIVE" card in Teacher Dashboard now uses crisp, theme-aware text with clear session timers and readable attendee counts.
            - "MARK MY ATTENDANCE" action button and active countdown banner in Student Room now provide sharp contrast and clear disabled states.
          - 👤 **Student Profile & Device MAC Binding**: Persistent storage of Student Full Name, Roll ID, and authentic IEEE 802 formatted MAC address.
          - 📱 **Realtime Attendance Sessions**: Supabase Realtime integration with role-based faculty & student portals.
          - 📡 **Classroom Gateway Integration**: Fully compatible with ESP32-S3 gateway firmware with deduplication, session nonce validation, and serial/cloud attendance reporting.
          - 🔗 **Dual-Role BLE Mesh**: Packet relay engine with bounded in-memory cache and TTL hop enforcement.
          EOF

          ARM64_APK="$GITHUB_WORKSPACE/release-assets/ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-arm64-v8a.apk"
          ARMV7_APK="$GITHUB_WORKSPACE/release-assets/ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-armeabi-v7a.apk"
          IOS_IPA="$GITHUB_WORKSPACE/release-assets/ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}.ipa"

          ASSETS=("$ARM64_APK" "$IOS_IPA")
          if [ -f "$ARMV7_APK" ]; then
            ASSETS+=("$ARMV7_APK")
          fi

          if gh release view "${{ steps.vars.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.vars.outputs.VERSION }} already exists. Overwriting assets and updating notes..."
            gh release upload "${{ steps.vars.outputs.VERSION }}" "${ASSETS[@]}" --clobber
            gh release edit "${{ steps.vars.outputs.VERSION }}" \
              --title "BLE Mesh Attendance ${{ steps.vars.outputs.VERSION }}" \
              --notes-file release_notes.md
          else
            echo "Creating new release ${{ steps.vars.outputs.VERSION }}..."
            gh release create "${{ steps.vars.outputs.VERSION }}" "${ASSETS[@]}" \
              --title "BLE Mesh Attendance ${{ steps.vars.outputs.VERSION }}" \
              --notes-file release_notes.md
          fi

name: Build & Release (APK + IPA)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.5.0-phase4)'
        required: true
        default: 'v0.5.0-phase4'
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: 🚀 Build APKs & IPA and Release
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=v0.5.0-phase4" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch flutter_ble_peripheral Swift syntax
        run: |
          python3 -c '
          import glob, os
          pattern = os.path.expanduser("~/.pub-cache/**/FlutterBlePeripheralPlugin.swift")
          for path in glob.glob(pattern, recursive=True):
              with open(path, "r") as f:
                  content = f.read()
              fixed = content.replace("uuids: map?[\"serviceUuids\"] as? [String] ,", "uuids: map?[\"serviceUuids\"] as? [String]")
              if fixed != content:
                  with open(path, "w") as f:
                      f.write(fixed)
                  print(f"Successfully patched trailing comma in {path}")
          '

      - name: Prepare Artifacts Directory
        run: mkdir -p "$GITHUB_WORKSPACE/release-assets"

      # ── 1. Build Universal Android APK ──
      - name: Build Universal Android APK
        run: flutter build apk --release

      - name: Prepare Universal APK Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/release-assets/ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-universal.apk"

      # ── 2. Build Split Android APK (arm64-v8a slim) ──
      - name: Build Split Android APKs (arm64-v8a)
        run: flutter build apk --split-per-abi --release

      - name: Prepare arm64-v8a APK Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/release-assets/ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-arm64-v8a.apk"

      # ── 3. Build iOS Unsigned IPA ──
      - name: Disable Apple Team Requirement
        run: |
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;//g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qq -r -9 "$GITHUB_WORKSPACE/release-assets/ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}.ipa" Payload
        working-directory: apps/mobile/build/ios/iphoneos

      # ── 4. Publish GitHub Release ──
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.vars.outputs.VERSION }}" \
            "$GITHUB_WORKSPACE/release-assets/ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-arm64-v8a.apk#ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-arm64-v8a.apk" \
            "$GITHUB_WORKSPACE/release-assets/ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-universal.apk#ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-universal.apk" \
            "$GITHUB_WORKSPACE/release-assets/ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}.ipa#ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}.ipa" \
            --title "BLE Mesh Attendance ${{ steps.vars.outputs.VERSION }}" \
            --notes "### BLE Mesh Attendance Mobile App Release ${{ steps.vars.outputs.VERSION }}

          #### 📦 Available Downloads:

          | File | Description |
          | :--- | :--- |
          | **\`ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-arm64-v8a.apk\`** | ⚡ **Recommended** for modern Android devices (64-bit ARM) |
          | **\`ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}-universal.apk\`** | 🌐 **Universal Android** — compatible with all Android devices & tablets |
          | **\`ble-mesh-attendance-${{ steps.vars.outputs.VERSION }}.ipa\`** | 🍎 **iOS Unsigned IPA** (Install via AltStore / Sideloadly / TrollStore / Scarlet) |

          #### 🚀 Highlights in this Release:
          - 👤 **Student Profile & Device MAC Binding**: Persistent storage of Student Full Name, Roll ID, and authentic IEEE 802 formatted MAC address.
          - 📱 **Student-Friendly UI**: Redesigned 2-tab interface featuring one-tap 'MARK MY ATTENDANCE', verified attendance badge with live timestamp, and on-screen 'Lecture Attendees' roster.
          - 📡 **Classroom Gateway Integration**: Fully compatible with ESP32-S3 gateway firmware with deduplication and serial attendance reports.
          - 🔗 **Dual-Role BLE Mesh**: Packet relay engine with bounded in-memory cache and TTL hop enforcement."

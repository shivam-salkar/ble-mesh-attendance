name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.4.0)'
        required: false
        default: 'v0.4.0'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get || flutter pub upgrade
        working-directory: apps/mobile

      - name: Run Code Analysis
        run: flutter analyze
        working-directory: apps/mobile

      - name: Run Test Suite
        run: flutter test
        working-directory: apps/mobile

      - name: Build Android Release APK
        run: flutter build apk --release
        working-directory: apps/mobile

      - name: Prepare Release Artifacts and Checksum
        id: artifacts
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.4.0-phase4"
          fi
          
          APK_SOURCE="apps/mobile/build/app/outputs/flutter-apk/app-release.apk"
          APK_TARGET="ble-mesh-attendance-${TAG}.apk"
          
          cp "$APK_SOURCE" "$APK_TARGET"
          
          SHA256=$(sha256sum "$APK_TARGET" | awk '{print $1}')
          echo "$SHA256  $APK_TARGET" > checksums.txt
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "apk_file=$APK_TARGET" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: notes
        env:
          TAG: ${{ steps.artifacts.outputs.tag }}
          APK_TARGET: ${{ steps.artifacts.outputs.apk_file }}
          SHA256: ${{ steps.artifacts.outputs.sha256 }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 -c "
          import os, datetime
          tag = os.environ['TAG']
          apk = os.environ['APK_TARGET']
          sha256 = os.environ['SHA256']
          commit = os.environ['COMMIT_SHA']
          build_date = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')
          
          content = f'''# BLE Mesh Attendance - Mobile Application Release

          ## Build Information
          - Release Tag: {tag}
          - Commit SHA: {commit}
          - Build Timestamp: {build_date}
          - Framework: Flutter 3.27.x / Dart 3.5+
          - Supported Android Platforms: Android 8.0 (API level 26) through Android 14 (API level 34)

          ## Overview
          This release package contains the compiled Android client application for the BLE Mesh Attendance system. The build includes Phase 4 cross-platform interoperability features including multi-role BLE communications, local packet relay forwarding, and direct communication with the ESP32-S3 classroom gateway.

          ## Key Capabilities
          - Diagnostic and Interoperability Test Screen (BleTestScreen)
          - Dual-role BLE Central and Peripheral subsystem
          - Application-level packet relay engine with bounded in-memory deduplication cache (128 entries, 5-minute expiration)
          - Time-to-Live (TTL) enforcement and hop count tracking
          - Ephemeral application-scoped device identifiers (PLATFORM-XXXX) preserving user privacy without hardware MAC exposure
          - Compatibility with ESP32-S3 Gateway Firmware (Phase 1 binary protocol and Phase 4 JSON test protocol)
          - Real-time telemetry event log for protocol debugging and transaction tracing

          ## Artifact Verification
          Artifact integrity and provenance can be verified against the following SHA-256 hash:
          \`\`\`
          {sha256}  {apk}
          \`\`\`

          ## Installation Instructions
          1. Download \`{apk}\` to your Android mobile device.
          2. In Android system settings, allow installation from unknown sources for your browser or file manager if prompted.
          3. Open the downloaded package to complete installation.
          4. When launching the application for the first time, approve the requested Bluetooth and Nearby Devices permissions.
          '''

          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write(content.strip() + '\n')
          "

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.tag }}
          name: BLE Mesh Attendance Mobile - ${{ steps.artifacts.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            ${{ steps.artifacts.outputs.apk_file }}
            checksums.txt

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mobile-ci:
    name: Flutter Mobile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Analyze code
        run: flutter analyze
        working-directory: apps/mobile

      - name: Run tests
        run: flutter test
        working-directory: apps/mobile

  build-android:
    name: Build Android APK
    needs: mobile-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Build Android Release APK
        run: flutter build apk --release
        working-directory: apps/mobile

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-ios:
    name: Build iOS (No Codesign)
    needs: mobile-ci
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install CocoaPods
        run: |
          pod --version || brew install cocoapods

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Build iOS Application
        run: flutter build ios --release --no-codesign
        working-directory: apps/mobile

      - name: Compress iOS Runner Bundle
        run: |
          cd apps/mobile/build/ios/iphoneos
          zip -r -y Runner.app.zip Runner.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-runner-app
          path: apps/mobile/build/ios/iphoneos/Runner.app.zip
          retention-days: 14
